x-function: &python
  volumes:
    - ./app:/app:rw
    - poetry-volume:/opt/poetry:delegated
  user: "${USER_ID}"
  environment: &env-vars
    POETRY_HOME: /opt/poetry
  networks:
    - internal
  depends_on:
    - app_db
    - redis
  env_file:
    .env

x-taskiq: &taskiq
  <<: *python
  build:
    context: .
    dockerfile: backend.dockerfile
  entrypoint: taskiq

services:

  app_db:
    container_name: ${PROJECT_SLUG}_db
    image: postgres:11
    volumes:
      - app_db-template:/var/lib/postgresql/data/pgdata:rw
    env_file:
      - .env
    networks:
      - internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: -p ${POSTGRES_PORT}

  app:
    <<: *python
    container_name: ${PROJECT_SLUG}_app
    build:
      context: .
      dockerfile: backend.dockerfile
    command: >
      python app/reloader.py
    depends_on:
      - telegram-server

  api:
    <<: *python
    container_name: ${PROJECT_SLUG}_api
    build:
      context: .
      dockerfile: api.dockerfile
    ports:
      - "8000:8000"

  redis:
    image: redis:7.0.11-alpine
    hostname: redis
    container_name: ${PROJECT_SLUG}_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    networks:
      - internal
    env_file:
      - .env

  worker:
    <<: *taskiq
    hostname: worker
    container_name: ${PROJECT_SLUG}_worker
    command: >
      worker app.core.taskiq:broker ${TASKIQ_TASKS_ROOT}

  mailing_worker:
    <<: *taskiq
    hostname: mass_mailing_worker
    container_name: ${PROJECT_SLUG}_mailing_worker
    command: >
      worker app.core.taskiq:broker ${TASKIQ_TASKS_ROOT} 
      --workers 1
      --max-async-tasks 1

  scheduler:
    <<: *taskiq
    container_name: ${PROJECT_SLUG}_scheduler
    command: >
      scheduler app.core.taskiq:scheduler ${TASKIQ_TASKS_ROOT}
    depends_on:
      - redis
      - app_db

  nginx:
    container_name: ${PROJECT_SLUG}_nginx
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - internal

  telegram-server:
    image: aiogram/telegram-bot-api:latest
    container_name: ${PROJECT_SLUG}_telegram-server
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_APP_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_APP_API_HASH}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - ${TELEGRAM_SERVER_PORT}:${TELEGRAM_SERVER_PORT}
    networks:
      - internal
    env_file:
      - .env

volumes:
  app_db-template:
  poetry-volume:
  telegram-bot-api-data:
  redis_data:

networks:
  internal: